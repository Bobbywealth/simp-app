# SIMP iOS Build — signed .ipa via GitHub Actions (macOS runner, manual signing)
#
# One-time setup: see docs/IOS_GITHUB_ACTIONS.md for the 7 secrets + cert rotation.
# Triggers: push to main touching frontend/, or manual dispatch from the Actions tab.
# Output: signed SIMP-<version>.ipa in the Actions artifacts, ready for App Store Connect.
#
# NOT included (yet): auto-upload to TestFlight. Flip the Enable_TestFlight_Upload
# repo variable to "true" once the first .ipa is verified.

name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/ios-build.yml'

env:
  APP_NAME: SIMP
  BUNDLE_ID: app.simp.client
  WORKSPACE: App.xcworkspace
  SCHEME: App
  CONFIGURATION: Release
  PODFILE_LOCK_PATH: frontend/ios/App/Podfile.lock

jobs:
  build:
    name: Build signed .ipa
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Typecheck (fail fast)
        working-directory: frontend
        run: npm run typecheck

      - name: Build web bundle
        working-directory: frontend
        env:
          # Sentry plugin uploads source maps if SENTRY_AUTH_TOKEN is set.
          # When unset, the plugin prints a warning and skips — build still succeeds.
          # Add the token as a GitHub secret when you wire up Sentry for SIMP.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: cap sync iOS
        working-directory: frontend
        run: npx cap sync ios

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install xcpretty (xcodebuild output formatter)
        run: gem install xcpretty --no-document

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            frontend/ios/App/Pods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles(env.PODFILE_LOCK_PATH) }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: pod install
        working-directory: frontend/ios/App
        run: pod install

      - name: Create temp keychain
        env:
          KEYCHAIN_PASSWORD: ci-keychain-temp-password
        run: |
          set -e
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | xargs)
          echo "✅ Temporary keychain created"

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_DIST_CERT_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ci-keychain-temp-password
        run: |
          set -e
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          CERT_PATH=$RUNNER_TEMP/cert.p12
          python3 -c "
          import base64, sys
          data = base64.b64decode(sys.argv[1])
          with open(sys.argv[2], 'wb') as f:
              f.write(data)
          " "$BUILD_CERTIFICATE_BASE64" "$CERT_PATH"
          security import $CERT_PATH \
            -P "$BUILD_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k $KEYCHAIN_PATH
          echo "✅ Distribution certificate imported"

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          set -e
          PROFILE_PATH=$RUNNER_TEMP/simp_app_store.mobileprovision
          # Python base64 decoder is bulletproof — handles long inputs without
          # the BSD `base64 --decode` "Unexpected character" error we hit on
          # macos-latest, and unlike openssl base64 -d doesn't silently truncate.
          python3 -c "
          import base64, sys
          data = base64.b64decode(sys.argv[1])
          with open(sys.argv[2], 'wb') as f:
              f.write(data)
          " "$BUILD_PROVISION_PROFILE_BASE64" "$PROFILE_PATH"
          echo "DEBUG: decoded profile size = $(wc -c < "$PROFILE_PATH") bytes (expected 12520)"
          # CMS-wrapped plist: unwrap with openssl to extract UUID, since
          # PlistBuddy can't parse the CMS binary directly.
          security cms -D -i "$PROFILE_PATH" -o "$RUNNER_TEMP/profile.plist" 2>/dev/null || \
            openssl smime -verify -in "$PROFILE_PATH" -inform der -noverify -out "$RUNNER_TEMP/profile.plist" 2>/dev/null
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          rm "$RUNNER_TEMP/profile.plist"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "✅ Profile installed with UUID $PROFILE_UUID"

      - name: Verify signing identity
        env:
          KEYCHAIN_PASSWORD: ci-keychain-temp-password
        run: |
          security find-identity -v -p codesigning $RUNNER_TEMP/build.keychain-db

      - name: Generate ExportOptions.plist
        working-directory: frontend/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
              <key>uploadSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>app.simp.client</key>
                  <string>SIMP App Store</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Archive (xcodebuild)
        working-directory: frontend/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # Capture full output to log file; tail it to the job log so failures
          # are visible without re-running locally.
          LOG=$RUNNER_TEMP/xcodebuild-archive.log
          xcodebuild \
            -workspace ${{ env.WORKSPACE }} \
            -scheme ${{ env.SCHEME }} \
            -configuration ${{ env.CONFIGURATION }} \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="SIMP App Store" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive 2>&1 | tee "$LOG" | xcpretty || {
              echo "❌ archive failed. Last 80 lines of xcodebuild output:"
              tail -80 "$LOG"
              exit 1
            }

      - name: Export .ipa
        working-directory: frontend/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath ${{ github.workspace }}/build \
            -exportOptionsPlist ExportOptions.plist | xcpretty || (echo "❌ export failed"; exit 1)
          ls -la ${{ github.workspace }}/build

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: simp-ios-ipa
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload to TestFlight (optional)
        if: ${{ vars.ENABLE_TESTFLIGHT_UPLOAD == 'true' }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -e
          API_KEY_PATH=$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8
          python3 -c "
          import base64, sys
          data = base64.b64decode(sys.argv[1])
          with open(sys.argv[2], 'wb') as f:
              f.write(data)
          " "$APPLE_API_KEY_BASE64" "$API_KEY_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file build/*.ipa \
            --apiKey $APPLE_API_KEY_ID \
            --apiIssuer $APPLE_API_ISSUER_ID
          echo "✅ Uploaded to App Store Connect / TestFlight"

      - name: Cleanup keychain
        if: always()
        env:
          KEYCHAIN_PASSWORD: ci-keychain-temp-password
        run: |
          security delete-keychain $RUNNER_TEMP/build.keychain-db || true
          rm -f $RUNNER_TEMP/cert.p12 $RUNNER_TEMP/simp_app_store.mobileprovision
          rm -f $RUNNER_TEMP/AuthKey_*.p8
