# SIMP Android Build — signed .aab via GitHub Actions (Linux runner)
#
# Secrets needed (4):
#   SIMP_ANDROID_KEYSTORE_FILE_BASE64 — base64 contents of simp-release.jks
#   SIMP_ANDROID_KEYSTORE_PASSWORD    — store password (PKCS12: same as key)
#   SIMP_ANDROID_KEY_ALIAS            — "simp"
#   SIMP_ANDROID_KEY_PASSWORD         — key password (PKCS12: same as store)
# SENTRY_AUTH_TOKEN is optional — if set, source maps are uploaded to Sentry.
#
# Triggers: push to main touching frontend/, or manual dispatch from the Actions tab.
# Output: signed SIMP-<version>.aab in the Actions artifacts, ready for Play Console.
#
# NOT included (yet): auto-upload to Google Play. That requires a service-account
# JSON in PLAY_STORE_JSON_KEY plus the google-github-actions/auth action. Wire it
# up once the first .aab is verified.

name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/android-build.yml'

env:
  APP_NAME: SIMP
  APPLICATION_ID: app.simp.client

jobs:
  build:
    name: Build signed .aab
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SIMP_ANDROID_KEYSTORE_FILE: /tmp/simp-release.jks
      SIMP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SIMP_ANDROID_KEYSTORE_PASSWORD }}
      SIMP_ANDROID_KEY_ALIAS: ${{ secrets.SIMP_ANDROID_KEY_ALIAS }}
      SIMP_ANDROID_KEY_PASSWORD: ${{ secrets.SIMP_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          android-api-level: '36'
          build-tools-version: '36.0.0'
          cache: gradle

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Typecheck (fail fast)
        working-directory: frontend
        run: npm run typecheck

      - name: Build web bundle
        working-directory: frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run build

      - name: cap sync Android
        working-directory: frontend
        run: npx cap sync android

      - name: Decode release keystore
        # Python — BSD base64/openssl base64 -d silently fail on long inputs
        # (~16KB+). Pattern confirmed across multiple Bobby-owned iOS workflows.
        run: |
          python3 -c "import base64,sys; open(sys.argv[2],'wb').write(base64.b64decode(sys.argv[1]))" \
            "${{ secrets.SIMP_ANDROID_KEYSTORE_FILE_BASE64 }}" /tmp/simp-release.jks
          chmod 600 /tmp/simp-release.jks
          ls -la /tmp/simp-release.jks

      - name: Bundle release .aab
        working-directory: frontend/android
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify .aab signature
        working-directory: frontend/android
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          ls -la "$AAB"
          sha256sum "$AAB"
          # Confirm it's a valid Android App Bundle (zip with manifest)
          unzip -l "$AAB" | head -10
          # Confirm signature via apksigner v2/v3 (apksigner ships with build-tools)
          apksigner verify --verbose --print-certs "$AAB" 2>&1 | head -20

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: simp-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30