services:
  - type: web
    name: simp-backend
    plan: standard
    runtime: node
    buildCommand: cd backend && npm ci --include=dev --no-audit --no-fund && npm run typecheck && npm run build
    preDeployCommand: cd backend && npx prisma migrate deploy
    startCommand: cd backend && node dist/server.js
    maxShutdownDelaySeconds: 120
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 4000
      - key: APP_VERSION
        value: 0.3.0-rc.1
      - key: DATABASE_URL
        fromDatabase:
          name: simp-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: IP_HASH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: ALLOWED_ORIGINS
        value: https://simp-web.onrender.com
      - key: PUBLIC_BASE_URL
        value: https://simp-backend-b8nz.onrender.com
      - key: FRONTEND_URL
        value: https://simp-web.onrender.com

      # Persistent image storage. All four Cloudinary values are required.
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: simp/profile-photos

      # Transactional email. Resend has a free tier; a verified sender is required.
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false

      # APNs + FCM delivery through Firebase Admin.
      - key: PUSH_PROVIDER
        value: firebase
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      - key: STUN_URLS
        value: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: TURN_PROVIDER
        sync: false

      - key: FREE_DAILY_LIKES
        value: 25
      - key: FREE_DAILY_SUPER_LIKES
        value: 1
      - key: SIMP_PLUS_PRODUCT_IDS
        value: app.simp.plus.monthly,app.simp.plus.yearly
      - key: SIMP_ELITE_PRODUCT_IDS
        value: app.simp.elite.monthly,app.simp.elite.yearly
      - key: APPLE_BUNDLE_ID
        value: app.simp.client
      - key: APPLE_IAP_ISSUER_ID
        sync: false
      - key: APPLE_IAP_KEY_ID
        sync: false
      - key: APPLE_IAP_PRIVATE_KEY
        sync: false
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: app.simp.client
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FEATURE_EXPERIENCES
        value: "false"
      - key: SENTRY_DSN
        sync: false
      - key: ANALYTICS_ENDPOINT
        sync: false
      - key: ANALYTICS_WRITE_KEY
        sync: false

  - type: web
    runtime: static
    name: simp-web
    buildCommand: cd frontend && npm ci --no-audit --no-fund && npm run typecheck && npm run lint && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://simp-backend-b8nz.onrender.com
      - key: VITE_APP_VERSION
        value: 0.3.0-rc.1
      - key: VITE_BILLING_ENABLED
        value: "false"
      - key: VITE_SENTRY_DSN
        sync: false

databases:
  - name: simp-db
    plan: basic_256mb
    databaseName: simp_app
    user: simp_user
    region: oregon
