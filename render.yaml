services:
  - type: web
    name: simp-backend
    plan: standard
    runtime: node
    buildCommand: cd backend && npm install --no-audit --no-fund && npm run build
    startCommand: cd backend && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: simp-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: ALLOWED_ORIGINS
        value: https://simp-web.onrender.com
    healthCheckPath: /health

  - type: static
    name: simp-web
    plan: free
    buildCommand: cd frontend && npm install --no-audit --no-fund && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://simp-backend-b8nz.onrender.com

databases:
  - name: simp-db
  plan: basic_256mb
  databaseName: simp_app
  user: simp_user
  region: oregon
  version: 16
