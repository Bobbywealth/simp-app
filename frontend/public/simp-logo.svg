<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" width="720" height="720">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBE6A1" />
      <stop offset="35%" stop-color="#E8C36A" />
      <stop offset="65%" stop-color="#C9962F" />
      <stop offset="100%" stop-color="#8B6520" />
    </linearGradient>
    <linearGradient id="goldGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A6E1F" />
      <stop offset="50%" stop-color="#F2D680" />
      <stop offset="100%" stop-color="#9A6E1F" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="720" fill="url(#bgGrad)" />

  <!-- Crown: 5 points + base line -->
  <g transform="translate(360, 110)" filter="url(#glow)">
    <!-- Base line -->
    <line x1="-80" y1="40" x2="80" y2="40" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <!-- 5 triangle points -->
    <polygon points="-80,40 -65,-20 -50,40" fill="url(#goldGrad)" />
    <polygon points="-50,40 -25,-55 0,40" fill="url(#goldGrad)" />
    <polygon points="0,40 25,-75 50,40" fill="url(#goldGrad)" />
    <polygon points="50,40 65,-20 80,40" fill="url(#goldGrad)" />
    <!-- 5 jewel circles at peak bases -->
    <circle cx="-65" cy="-20" r="3" fill="#FBE6A1" />
    <circle cx="-25" cy="-55" r="3" fill="#FBE6A1" />
    <circle cx="25" cy="-75" r="3.5" fill="#FBE6A1" />
    <circle cx="65" cy="-20" r="3" fill="#FBE6A1" />
    <circle cx="-13" cy="22" r="3" fill="#FBE6A1" />
    <circle cx="13" cy="22" r="3" fill="#FBE6A1" />
  </g>

  <!-- Large flowing "S" -->
  <g transform="translate(360, 330)" filter="url(#glow)">
    <path
      d="M 110,-180
         C 60,-200 -80,-180 -80,-90
         C -80,-20 80,-10 110,30
         C 140,70 60,110 -40,110
         C -130,110 -160,40 -160,40"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="22"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Wordmark "S I M P" -->
  <g transform="translate(360, 530)">
    <text
      x="0"
      y="0"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="92"
      font-weight="400"
      letter-spacing="22"
      fill="url(#goldGrad)"
      style="text-transform: uppercase;"
    >SIMP</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(360, 620)">
    <text
      x="0"
      y="0"
      text-anchor="middle"
      font-family="Inter, Helvetica, Arial, sans-serif"
      font-size="19"
      font-weight="500"
      letter-spacing="6"
      fill="url(#goldGradH)"
      style="text-transform: uppercase;"
    >SUCCESSFUL · INTENTIONAL · MALE · PROVIDERS</text>
  </g>

  <!-- Thin gold divider lines on sides of tagline -->
  <line x1="80" y1="615" x2="180" y2="615" stroke="url(#goldGradH)" stroke-width="1" />
  <line x1="540" y1="615" x2="640" y2="615" stroke="url(#goldGradH)" stroke-width="1" />
</svg>
