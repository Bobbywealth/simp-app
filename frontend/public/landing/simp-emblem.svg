<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e6b8"/>
      <stop offset="45%" stop-color="#e8d598"/>
      <stop offset="65%" stop-color="#d4a93a"/>
      <stop offset="100%" stop-color="#a98320"/>
    </linearGradient>
    <radialGradient id="bgGradient" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGradient)"/>

  <g transform="translate(256, 256)">
    <!-- Crown at top (small, elegant) -->
    <g transform="translate(0, -140)">
      <!-- Crown base line -->
      <line x1="-60" y1="0" x2="60" y2="0" stroke="url(#goldGradient)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
      
      <!-- Crown points - 5 triangular peaks -->
      <!-- Center peak (tallest) -->
      <polygon points="0,-50 -8,-8 8,-8" fill="url(#goldGradient)" filter="url(#glow)"/>
      
      <!-- Left-center peak -->
      <polygon points="-30,-35 -38,-8 -22,-8" fill="url(#goldGradient)"/>
      
      <!-- Right-center peak -->
      <polygon points="30,-35 22,-8 38,-8" fill="url(#goldGradient)"/>
      
      <!-- Far left peak -->
      <polygon points="-58,-25 -64,-5 -52,-5" fill="url(#goldGradient)" opacity="0.9"/>
      
      <!-- Far right peak -->
      <polygon points="58,-25 52,-5 64,-5" fill="url(#goldGradient)" opacity="0.9"/>
    </g>

    <!-- Large elegant S -->
    <g transform="translate(0, 10)">
      <!-- Upper S curve -->
      <path 
        d="M 60 -90 Q 90 -100 90 -60 Q 90 -35 55 -25 Q 20 -15 0 0 Q -20 10 -55 20 Q -90 30 -90 60 Q -90 90 -60 100 Q -20 115 20 90 Q 50 75 60 40" 
        stroke="url(#goldGradient)" 
        stroke-width="48" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"
        filter="url(#glow)"
      />
    </g>
  </g>

  <!-- Subtle outer ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="url(#goldGradient)" stroke-width="0.5" opacity="0.2"/>
</svg>
